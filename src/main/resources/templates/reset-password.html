<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Choose a new password | Expenses Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 540px;">
    <h1 class="h3 mb-3">Choose a new password</h1>
    <div class="alert alert-danger" role="alert" th:if="${resetError}" th:text="${resetError}"></div>
    <form th:action="@{/reset-password}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <div class="mb-3">
            <label for="password" class="form-label">New password</label>
            <input id="password" name="password" type="password" class="form-control"
                   autocomplete="new-password" minlength="8" required>
        </div>
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm new password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" class="form-control"
                   autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-dark">Save new password</button>
    </form>
</main>
</body>
</html>
