<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password | Expenses Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 540px;">
    <h1 class="h3 mb-3">Reset your password</h1>
    <p>Enter your username. If it belongs to an account, we’ll email a one-time reset link.</p>
    <div class="alert alert-warning" role="alert" th:unless="${emailConfigured}">
        Email delivery has not been configured yet. Please contact the site administrator.
    </div>
    <div class="alert alert-success" role="alert" th:if="${resetMessage}" th:text="${resetMessage}"></div>
    <div class="alert alert-danger" role="alert" th:if="${resetError}" th:text="${resetError}"></div>
    <form th:if="${emailConfigured}" th:action="@{/password-reset}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input id="username" name="username" class="form-control" autocomplete="username" required>
        </div>
        <button type="submit" class="btn btn-dark">Send reset link</button>
        <a th:href="@{/showLoginPage}" class="btn btn-link">Back to sign in</a>
    </form>
</main>
</body>
</html>
