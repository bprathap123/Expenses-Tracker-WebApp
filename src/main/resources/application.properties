spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expenses_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8081}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8081}
app.oauth.facebook.api-version=${FACEBOOK_API_VERSION:v22.0}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000