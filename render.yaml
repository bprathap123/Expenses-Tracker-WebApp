    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /showLoginPage
    envVars:
      - key: DB_URL
        value: jdbc:mysql://mysql-21f11ff1-prathap7780-7d47.f.aivencloud.com:15170/defaultdb?sslMode=REQUIRED
